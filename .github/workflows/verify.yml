name: Verify source and plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout Framework Python ABI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gaofeng21cn/one-person-lab
          path: framework
          sparse-checkout: python
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install lossless media and subtitle tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends webp flac ffmpeg fonts-noto-cjk
      - run: python -m pip install -r runtime/workbench/requirements.txt
      - name: Install and verify paper_theatre Remotion kit
        run: |
          npm --prefix runtime/workbench/templates/animation/paper_theatre ci --ignore-scripts --no-audit --no-fund
          npm --prefix runtime/workbench/templates/animation/paper_theatre test
      - env:
          OPL_FRAMEWORK_PYTHON_ROOT: ${{ github.workspace }}/framework/python
        run: scripts/verify.sh fast
