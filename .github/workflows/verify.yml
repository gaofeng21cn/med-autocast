name: Verify source and plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r runtime/workbench/requirements.txt
      - run: scripts/verify.sh fast
