schema: medical_video_backend_catalog/v1
updated_at: 2026-11-09
purpose: >-
  当前已接入的媒体后端能力目录。实际主机、端口、运行时路径和默认选择
  属于 profiles/backends/ 中的部署档案。

definitions:
  video:
    javascript_animation:
      label: 本地 JavaScript 医学动画
      provider: local
      kind: javascript_animation
      protocol: browser_frame_capture
      selection: automatic
      default: true
      role: primary_video_generation
      runtime: node20_playwright_ffmpeg
      capabilities:
        deterministic_timeline: true
        svg_canvas_animation: true
        reviewed_image_assets: true
        local_render: true
        audio_sync: true
      implementation_docs: docs/12_JS动画默认技术路线.md
    minimax_h3_comfyui:
      label: MiniMax H3 ComfyUI
      provider: minimax
      kind: comfyui
      protocol: comfyui_prompt_history
      selection: explicit
      default: false
      role: optional_video_generation
      models: [MiniMax-H3]
      capabilities:
        text_to_video: true
        image_conditioning: true
        asynchronous: true
      implementation_docs: backends/h3/README.md
  audio:
    edge_tts:
      label: Edge TTS XiaoyiNeural
      provider: microsoft
      kind: edge_tts
      protocol: edge_tts_cli
      selection: profile
      role: fallback_narration
      voice: zh-CN-XiaoyiNeural
      capabilities:
        chinese: true
        local_client: true
        network_required: true
        reference_voice: false
      implementation_docs: docs/12_JS动画默认技术路线.md
    voxcpm_2:
      label: VoxCPM2
      provider: openbmb
      kind: voxcpm
      protocol: voxcpm_python_api
      selection: author_profile
      role: primary_narration
      models: [VoxCPM2]
      capabilities:
        reference_voice: true
        chinese: true
        style_instruction: true
        sample_rate_hz: 48000
        pronunciation_control: native_pinyin_braces_from_editorial_annotations_with_required_listening
      implementation_docs: backends/voxcpm/README.md
