schema: medical_video_author_profile/v1
profile_id: example_author
display_name: Example Doctor
language: zh-CN
audience: adult_patients_and_families
baseline:
  version: null
  author_identity: null
  professional_scope: []
  presenter_identity_note: null
  asset_authorization_refs: []
  style_reference: null
  review:
    identity: pending
    visual: pending
    voice: pending
    style: pending
    evidence_refs: []
persona:
  role: patient_facing_medical_explainer
  tone: [clear, calm, trustworthy]
  medical_claim_owner: reviewed_narration_and_subtitles
voice:
  preferred_backend_definition: indextts_2_5
  reference_audio: assets/authors/example_author/voice_reference.wav
