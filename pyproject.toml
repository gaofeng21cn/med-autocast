[project]
name = "med-autocast-helpers"
version = "0.3.21"
description = "Med Auto Cast read-only workspace and delivery helpers"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
workbench = [
    "Pillow>=10,<13",
    "pysubs2>=1.7,<2",
    "pyloudnorm>=0.1.1,<1",
    "soundfile>=0.12,<1",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
