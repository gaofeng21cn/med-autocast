schema: medical_video_backend_profile/v1
profile_id: example_deployment
catalog: backends/config/media_backends.yaml
tools:
  font: null
video:
  js_animation_local:
    definition: javascript_animation
    label: 本地 JavaScript/SVG/Canvas 动画
    kind: javascript_animation
    mode: local
    runtime: node20_playwright_ffmpeg
    selection: automatic
    default: true
    role: primary_video_generation
    capability: reference_prototype
  optional_comfyui_remote:
    definition: minimax_h3_comfyui
    label: User-configured remote ComfyUI backend
    kind: comfyui_remote
    endpoint: ${COMFYUI_REMOTE_ENDPOINT:-}
    selection: explicit
    default: false
    role: optional_video_generation
    capability: optional_candidate
  optional_comfyui_local:
    definition: minimax_h3_comfyui
    label: User-configured local ComfyUI backend
    kind: comfyui
    endpoint: ${COMFYUI_LOCAL_ENDPOINT:-}
    selection: explicit
    default: false
    role: optional_video_generation
    capability: optional_candidate
  optional_comfyui_mlx:
    definition: minimax_h3_comfyui
    label: User-configured ComfyUI MLX backend
    kind: comfyui
    endpoint: ${COMFYUI_MLX_ENDPOINT:-}
    selection: explicit
    default: false
    role: optional_video_generation
    capability: optional_candidate
    workflow: user_supplied_comfyui_api_workflow_required
audio:
  edge_tts_local:
    definition: edge_tts
    label: Edge TTS XiaoyiNeural 本地保底
    kind: edge_tts
    mode: network_client
    device: cpu
    voice: zh-CN-XiaoyiNeural
    capability: configured_requires_network_verification
  voxcpm_reference:
    definition: voxcpm_2
    label: User-configured VoxCPM2 reference voice
    kind: voxcpm
    root: ${VOXCPM_ROOT:-$HOME/.local/share/med-autocast/voxcpm2}
    python: ${VOXCPM_PYTHON:-$HOME/.local/share/med-autocast/voxcpm2/.venv/bin/python}
    model_root: ${VOXCPM_MODEL_ROOT:-$HOME/.local/share/med-autocast/voxcpm2/models/VoxCPM2}
    runtime_profile:
      normalize: false
      inference_timesteps: 10
    capability: candidate
policy:
  default_video: js_animation_local
  default_audio: edge_tts_local
