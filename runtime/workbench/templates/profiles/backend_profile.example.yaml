schema: medical_video_backend_profile/v1
profile_id: example_deployment
catalog: backends/config/media_backends.yaml
tools:
  font: null
video:
  js_animation_local:
    definition: javascript_animation
    label: 本地 JavaScript/SVG/Canvas 动画
    kind: javascript_animation
    mode: local
    device: cpu_or_mps
    runtime: node20_playwright_ffmpeg
    capability: reference_prototype
  preferred_video:
    definition: minimax_h3_api
    label: User-configured MiniMax H3 API
    endpoint: ${MINIMAX_VIDEO_API_BASE_URL:-}
    model: MiniMax-H3
    capability: contract_documented
audio:
  edge_tts_local:
    definition: edge_tts
    label: Edge TTS XiaoyiNeural 本地保底
    kind: edge_tts
    mode: network_client
    device: cpu
    voice: zh-CN-XiaoyiNeural
    capability: configured_requires_network_verification
  preferred_audio:
    definition: indextts_2_5
    label: User-configured IndexTTS runtime
    kind: indextts
    device: mps
    root: ${INDEXTTS_ROOT:-$HOME/ai/index-tts}
    model_root: ${INDEXTTS_MODEL_ROOT:-$HOME/ai/index-tts/checkpoints}
    capability: candidate
policy:
  default_video: js_animation_local
  # 只有作者没有授权声线基线时才使用 Edge TTS 保底；实际作者档案优先。
  default_audio: indextts_local_mac
  preserve_remote_4090: false
